<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛貓咪圖庫</title>
    <link rel="stylesheet" href="全局基礎樣式.css">
</head>
<body>

    <header>
        <h1>🐱 可愛貓咪畫廊</h1>
        <p>滑鼠移至圖片上方可查看懸浮效果，點擊圖片前往相應網站</p>
    </header>

    <main class="gallery-container">
        <!-- 圖片 1：橘貓 -> 前往 Google -->
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="gallery-card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80" alt="睡覺的可愛貓咪">
            <div class="card-title">探訪 Google</div>
        </a>

        <!-- 圖片 2：白貓 -> 前往 YouTube -->
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="gallery-card">
            <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80" alt="大眼睛可愛貓咪">
            <div class="card-title">觀看 YouTube</div>
        </a>

        <!-- 圖片 3：花貓 -> 前往 維基百科 -->
        <a href="https://zh.wikipedia.org" target="_blank" rel="noopener noreferrer" class="gallery-card">
            <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80" alt="戴墨鏡的酷貓咪">
            <div class="card-title">查閱 維基百科</div>
        </a>

        <!-- 圖片 4：黑貓 -> 前往 GitHub -->
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="gallery-card">
            <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&fit=crop&w=400&q=80" alt="慵懶的貓咪">
            <div class="card-title">造訪 GitHub</div>
        </a>

        <!-- 圖片 5：灰貓 -> 前往 Bing -->
        <a href="https://www.bing.com" target="_blank" rel="noopener noreferrer" class="gallery-card">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=400&q=80" alt="好奇的小貓">
            <div class="card-title">搜尋 Bing</div>
        </a>
    </main>

</body>
</html>
